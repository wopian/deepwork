name: Checks
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - run: bun run check:runtime
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: ./scripts/check-no-node.ps1
      - run: cargo test --workspace --locked
      - run: bun run test:browser
      - run: cargo build --release -p mine-core --example balance --locked
      - name: Verify first retirement on every geological profile
        run: |
          foreach ($profile in 0..2) {
            & .\target\release\examples\balance.exe depth $profile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
